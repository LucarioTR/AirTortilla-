{% extends "base.html" %}
{% block content %}
<h3>Registro de Trazabilidad (Auditoría)</h3>
<table class="table table-striped mt-3 bg-white shadow-sm">
    <thead>
        <tr>
            <th>ID</th>
            <th>Usuario Responsable</th>
            <th>Acción Realizada</th>
            <th>Fecha y Hora (UTC)</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.id }}</td>
            <td>{{ log.user.username }}</td>
            <td>{{ log.action }}</td>
            <td>{{ log.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
